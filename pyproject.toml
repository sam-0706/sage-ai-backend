[project]
name = "sage-ai-backend"
version = "1.0.0"
description = "SAGE AI (Strategic Action and Growth Engine) — FastAPI backend for web, desktop and mobile clients"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118,<1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "openai>=1.109",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["uvicorn[standard]>=0.30", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.uv]
package = false
